# .github/workflows/deploy-xlam.yml
name: Deploy XLAM

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install MS-CFB and MS-Pcode-Assembler from dev branches (required for OleFile)
          pip install git+https://github.com/Beakerboy/MS-CFB@dev
          pip install git+https://github.com/Beakerboy/MS-Pcode-Assembler@dev
          # Install compression and crypto libraries
          pip install ms-ovba-compression ms-ovba-crypto
          # Install your MS-OVBA fork
          pip install git+https://github.com/James-McNeil/MS-OVBA.git
          # Install Excel-Addin-Generator
          pip install git+https://github.com/James-McNeil/Excel-Addin-Generator.git

      - name: Build vbaProject.bin from source
        run: |
          python - <<'EOF'
          from vbaProjectCompiler.builder import build_from_directory
          from ms_cfb.ole_file import OleFile
          from ms_cfb.Models.Directories.storage_directory import StorageDirectory
          from ms_cfb.Models.Directories.stream_directory import StreamDirectory
          import os

          # Build VBA project from source files
          print("Building VBA project from directory structure...")
          project = build_from_directory("VBA-Sync")
          print(f"Created project with {len(project.modules)} modules")

          # Create binary files for each module
          print("\nCreating module binaries...")
          project._create_binary_files()

          # Build OLE directory structure
          print("Building OLE directory structure...")
          vba_storage = StorageDirectory()
          vba_storage.set_name("VBA")

          # Add each module as a stream
          for module in project.modules:
              bin_path = f"vbaProjectCompiler/blank_files/{module.get_name()}.cls.bin"
              if os.path.exists(bin_path):
                  stream_dir = StreamDirectory()
                  stream_dir.set_name(module.get_name())
                  stream_dir.add_stream(bin_path)
                  vba_storage.add_directory(stream_dir)
                  print(f"  Added module: {module.get_name()}")

          # Create OLE file and write vbaProject.bin
          print("\nWriting vbaProject.bin...")
          ole_file = OleFile()
          ole_file.add_directory(vba_storage)
          ole_file.build_file()
          ole_file.write_file(".", "vbaProject.bin")
          
          print("Successfully created vbaProject.bin!")
          EOF

      - name: Package as Excel Add-in (.xlam)
        run: |
          python - <<'EOF'
          import os
          from pathlib import Path
          from excelAddinGenerator.main import createFromBin

          def package_xlam(vba_bin, output_xlam):
              """Package vbaProject.bin into Excel Add-in (.xlam)."""
              print(f"Creating {output_xlam} from {vba_bin}...")
              
              # Get wrapper directory from excelAddinGenerator package
              import excelAddinGenerator
              package_dir = Path(excelAddinGenerator.__file__).parent.parent
              wrapper_dir = str(package_dir / "src" / "data")
              
              # Create .xlam file
              createFromBin(vba_bin, wrapper_dir, output_xlam)
              
              # Cleanup intermediate binary
              if os.path.exists(vba_bin):
                  os.remove(vba_bin)
                  print(f"Cleaned up {vba_bin}")
              
              print(f"Successfully created {output_xlam}")

          # Package the binary into .xlam
          package_xlam("vbaProject.bin", "VBA Sync.xlam")
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: VBA Sync.xlam
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
